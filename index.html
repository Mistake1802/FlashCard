<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard từ vựng</title>
<style>
:root{--bg:#eef1ee;--ink:#1b2a41;--mute:#5d6b7a;--line:#d3dad6;--acc:#2a6f6b;--ok:#2f855a;--no:#b7701f;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0}
button,.btn{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button:active,.btn:active{transform:scale(.97)}
button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.primary{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:default}
#file{display:none}
#msg{font-size:14px;color:var(--acc);min-height:20px;margin:0 0 8px}
#msg.err{color:#b3261e}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:36px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{opacity:.7;font-weight:500;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin:4px 0 6px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.scene{perspective:1200px}
.card{position:relative;width:100%;height:300px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);cursor:pointer;border-radius:18px;outline-offset:3px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:auto;box-shadow:0 8px 24px rgba(27,42,65,.12)}
.front{background:var(--card);border:1.5px solid var(--line)}
.back{background:var(--ink);color:#fff;transform:rotateY(180deg)}
.word{font:700 clamp(30px,9vw,44px)/1.15 Georgia,"Times New Roman",serif;word-break:break-word}
.mean{font-size:clamp(22px,6vw,28px);font-weight:700;line-height:1.3}
.ex{margin-top:14px;font-style:italic;color:#c9d6e3;font-size:16px}
.hint{position:absolute;bottom:12px;font-size:12px;color:var(--mute)}
.back .hint{color:#9fb0c3}
.badge{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#e3f3ea;color:var(--ok)}
.row{display:grid;gap:10px;margin-top:14px}
.row.two{grid-template-columns:1fr 1fr}
.ok{border-color:var(--ok);color:var(--ok)}.ok.on{background:var(--ok);color:#fff}
.no{border-color:var(--no);color:var(--no)}.no.on{background:var(--no);color:#fff}
.tog.on{background:var(--acc);border-color:var(--acc);color:#fff}
.danger{border-color:transparent;color:#b3261e;font-size:14px;min-height:36px}
.empty{text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:18px;background:#fff}
.empty p{color:var(--mute);margin:8px 0 18px}
.tips{display:grid;gap:10px}
.tip{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.tip b{display:block;margin-bottom:2px}
.tip span{color:var(--mute);white-space:pre-wrap}
@media(prefers-reduced-motion:reduce){.card{transition:none}.prog i{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Flashcard từ vựng</h1>
    <label class="btn primary" for="file" tabindex="0" id="pick">Chọn file</label>
    <input id="file" type="file" accept=".xlsx">
  </header>
  <p id="msg" role="status"></p>
  <div id="chips" class="chips" hidden></div>
  <div id="view"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY = 'vocab-flashcards-v1';
let S = { decks: [], cur: null };
let order = [], pos = 0, flipped = false, onlyUnknown = false, fillTimer = 0;
const $ = id => document.getElementById(id);

/* ---------- Lưu trữ ---------- */
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.decks)) S = d; } catch (e) {}
  if (!S.decks.find(d => d.id === S.cur)) S.cur = S.decks.length ? S.decks[0].id : null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { say('Không lưu được vào trình duyệt (bộ nhớ đầy hoặc bị chặn).', true); }
}
function say(t, err) { const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }
const deck = () => S.decks.find(d => d.id === S.cur);

/* ---------- Đọc Excel ---------- */
const txt = v => String(v == null ? '' : v).normalize('NFC').trim();
const isHeader = t => /^(từ|word|vocab)/i.test(t);
const isTipName = t => /mẹo|tip|ghi chú|note|lưu ý/i.test(t);

function parseSheet(name, ws) {
  if (!ws || !ws['!ref']) return null;
  const rng = XLSX.utils.decode_range(ws['!ref']);
  rng.s = { r: 0, c: 0 };
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, range: rng });
  const formula = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return !!(x && x.f); };
  const bad = (r, i) => formula(i, 0) || formula(i, 1) || txt(r[0]).startsWith('=') || txt(r[1]).startsWith('=');

  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    if (isHeader(txt(rows[i][0]))) { h = i; break; }
  }
  const start = h + 1;
  const data = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    if (bad(r, i)) continue;
    data.push({ a: txt(r[0]), b: txt(r[1]), c: txt(r[2]) });
  }
  const filled = data.filter(x => x.a || x.b);
  const avgA = filled.length ? filled.reduce((s, x) => s + x.a.length, 0) / filled.length : 0;
  const tipLike = (h >= 0 && isTipName(txt(rows[h][0])) && !/^(từ|word|vocab)/i.test(txt(rows[h][0]))) ||
                  isTipName(name) || (h < 0 && avgA > 35);

  if (tipLike) {
    const tips = filled.map(x => ({ a: x.a, b: [x.b, x.c].filter(Boolean).join('\n') }));
    return tips.length ? { name, type: 'tips', tips } : null;
  }
  const cards = data
    .filter(x => x.a && x.b && !isHeader(x.a))
    .map(x => ({ w: x.a, m: x.b, e: x.c, known: false }));
  return cards.length ? { name, type: 'cards', cards } : null;
}

async function readFile(file) {
  if (typeof XLSX === 'undefined') { say('Chưa tải được thư viện SheetJS. Hãy kiểm tra kết nối mạng rồi tải lại trang.', true); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let nCards = 0, nTips = 0, nDecks = 0;
    wb.SheetNames.forEach(sn => {
      const d = parseSheet(sn, wb.Sheets[sn]);
      if (!d) return;
      let nm = d.name, k = 2;
      while (S.decks.some(x => x.name === nm)) nm = d.name + ' (' + k++ + ')';
      d.name = nm;
      d.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      S.decks.push(d);
      if (d.type === 'cards') { nCards += d.cards.length; nDecks++; } else nTips++;
      if (!S.cur || nDecks + nTips === 1) S.cur = d.id;
    });
    if (!nCards && !nTips) { say('Không tìm thấy từ vựng nào. Cột A là từ tiếng Anh, cột B là nghĩa, cột C là ví dụ.', true); return; }
    save();
    say(`Đã tạo ${nCards} thẻ từ ${nDecks} bộ` + (nTips ? `, ${nTips} trang mẹo` : '') + '.');
    selectDeck(S.cur);
  } catch (e) {
    say('Không đọc được file. Hãy chọn file .xlsx hợp lệ.', true);
  }
}

/* ---------- Điều khiển ---------- */
function selectDeck(id) {
  S.cur = id; save();
  const d = deck();
  order = d && d.type === 'cards' ? d.cards.map((_, i) => i) : [];
  pos = 0; flipped = false; onlyUnknown = false;
  render();
}
function list() {
  const d = deck();
  return order.filter(i => !onlyUnknown || !d.cards[i].known);
}
function go(n) {
  const l = list(); if (!l.length) return;
  pos = (pos + n + l.length) % l.length;
  showCard();
}
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; showCard();
}
function mark(val) {
  const d = deck(), l = list(); if (!l.length) return;
  d.cards[l[pos]].known = val; save();
  if (onlyUnknown) { if (pos >= list().length) pos = 0; renderStudy(); }
  else { pos = (pos + 1) % l.length; showCard(); }
  renderChips();
}
function flip() {
  flipped = !flipped;
  const c = document.querySelector('.card'); if (c) c.classList.toggle('flip', flipped);
}
function removeDeck() {
  const d = deck(); if (!d || !confirm(`Xóa bộ "${d.name}"?`)) return;
  S.decks = S.decks.filter(x => x.id !== d.id);
  S.cur = S.decks.length ? S.decks[0].id : null;
  save(); selectDeck(S.cur);
}

/* ---------- Hiển thị ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function btn(label, cls, fn) { const b = el('button', cls, label); b.type = 'button'; b.onclick = fn; return b; }

function renderChips() {
  const c = $('chips'); c.textContent = '';
  c.hidden = !S.decks.length;
  S.decks.forEach(d => {
    const b = el('button', 'chip' + (d.id === S.cur ? ' on' : ''), d.name);
    b.type = 'button';
    b.append(el('small', '', d.type === 'tips' ? 'Mẹo' : `${d.cards.filter(x => x.known).length}/${d.cards.length}`));
    b.onclick = () => selectDeck(d.id);
    c.append(b);
  });
}

function render() { renderChips(); renderStudy(); }

function renderStudy() {
  const v = $('view'); v.textContent = '';
  const d = deck();

  if (!d) {
    const e = el('div', 'empty');
    e.append(el('h2', '', 'Chưa có bộ từ nào'));
    e.append(el('p', '', 'Chọn file Excel (.xlsx): mỗi sheet là một bộ flashcard. Cột A là từ tiếng Anh, cột B là nghĩa, cột C là câu ví dụ.'));
    e.append(btn('Chọn file .xlsx', 'primary', () => $('file').click()));
    v.append(e); return;
  }

  if (d.type === 'tips') {
    const t = el('div', 'tips');
    d.tips.forEach(x => {
      const c = el('div', 'tip');
      if (x.a) c.append(el('b', '', x.a));
      if (x.b) c.append(el('span', '', x.b));
      t.append(c);
    });
    v.append(t, delBtn()); return;
  }

  const total = d.cards.length, known = d.cards.filter(c => c.known).length;
  const bar = el('div', 'bar'); bar.id = 'bar';
  const prog = el('div', 'prog'); prog.append(document.createElement('i'));
  const sc = el('div', 'scene');
  const card = el('div', 'card'); card.tabIndex = 0; card.setAttribute('role', 'button');
  card.setAttribute('aria-label', 'Bấm để lật thẻ');
  card.onclick = flip;
  const f = el('div', 'face front'), b = el('div', 'face back');
  f.id = 'front'; b.id = 'backf';
  card.append(f, b); sc.append(card);
  v.append(bar, prog, sc);

  const nav = el('div', 'row two');
  nav.append(btn('← Trước', '', () => go(-1)), btn('Sau →', 'primary', () => go(1)));
  const mk = el('div', 'row two');
  const bn = btn('Chưa thuộc', 'no', () => mark(false)), bo = btn('Đã thuộc', 'ok', () => mark(true));
  bn.id = 'bn'; bo.id = 'bo';
  mk.append(bn, bo);
  const tools = el('div', 'row two');
  tools.append(
    btn('Xáo trộn', '', shuffle),
    btn('Chỉ ôn từ chưa thuộc', 'tog' + (onlyUnknown ? ' on' : ''), () => {
      onlyUnknown = !onlyUnknown; pos = 0; flipped = false; renderStudy();
    })
  );
  v.append(nav, mk, tools, delBtn());
  showCard();
}
function delBtn() {
  const w = el('div', 'row'); w.append(btn('Xóa bộ này', 'danger', removeDeck)); return w;
}

function showCard() {
  const d = deck(), l = list();
  const card = document.querySelector('.card');
  if (!card) return;
  const total = d.cards.length, known = d.cards.filter(c => c.known).length;
  document.querySelector('.prog i').style.width = (total ? known / total * 100 : 0) + '%';
  const bar = $('bar'); bar.textContent = '';
  bar.append(el('span', '', l.length ? `Thẻ ${pos + 1}/${l.length}` : 'Không có thẻ'), el('span', '', `Đã thuộc ${known}/${total}`));

  clearTimeout(fillTimer);
  const fill = () => {
    const f = $('front'), b = $('backf');
    f.textContent = ''; b.textContent = '';
    if (!l.length) {
      f.append(el('div', 'mean', 'Bạn đã thuộc hết bộ này 🎉'));
      f.append(el('p', 'hint', 'Tắt "Chỉ ôn từ chưa thuộc" để xem lại tất cả.'));
      ['bn', 'bo'].forEach(i => $(i).disabled = true);
      return;
    }
    ['bn', 'bo'].forEach(i => $(i).disabled = false);
    const c = d.cards[l[pos]];
    f.append(el('div', 'word', c.w), el('div', 'hint', 'Bấm để lật'));
    b.append(el('div', 'mean', c.m));
    if (c.e) b.append(el('div', 'ex', c.e));
    b.append(el('div', 'hint', 'Bấm để lật lại'));
    if (c.known) { f.append(el('span', 'badge', 'Đã thuộc')); b.append(el('span', 'badge', 'Đã thuộc')); }
    $('bo').classList.toggle('on', c.known);
    $('bn').classList.toggle('on', !c.known);
  };
  if (flipped) {
    flipped = false; card.classList.remove('flip');
    fillTimer = setTimeout(fill, 220);
  } else fill();
}

/* ---------- Sự kiện ---------- */
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) readFile(f);
  e.target.value = '';
});
$('pick').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
document.addEventListener('keydown', e => {
  const d = deck(); if (!d || d.type !== 'cards') return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); flip(); }
});

load();
render();
</script>
</body>
</html>
